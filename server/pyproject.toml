[project]
name = "a-box-for-you-server"
version = "0.1.0"
description = "Backend for A Box For You — stores packed boxes and the recipient's unwrapping session."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["ruff>=0.8", "httpx>=0.27", "pytest>=8.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
